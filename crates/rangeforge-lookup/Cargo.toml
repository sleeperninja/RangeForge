[package]
name = "rangeforge-lookup"
description = "Looking songs up in outside data: the Billboard Hot 100 history, kept as a small local index."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
# The platform's own certificate checks are used, so a network that re-signs traffic with its
# own certificate (common at work) still works.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
