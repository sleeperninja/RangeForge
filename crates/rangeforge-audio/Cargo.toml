[package]
name = "rangeforge-audio"
description = "Decodes audio files once and measures loudness per CUE track."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1"
ebur128 = "0.1"
rangeforge-core = { path = "../rangeforge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["all"] }
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
