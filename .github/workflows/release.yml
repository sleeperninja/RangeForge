name: Release

# Builds the installers (an MSI for Windows, and a DMG holding RangeForge.app for macOS) and one
# Manual PDF (manual, FAQ and third-party notices together).
# It is started by hand (Actions tab, or `gh workflow run release.yml --ref main -f publish=true`),
# never by a push, so documents and fixes can reach main without a 30-minute build. With
# "publish" ticked it also puts everything on a draft release (a pre-release while the version
# starts with 0) named after the version in Cargo.toml, so raise the version first. It refuses
# to touch a release that is already published. Without "publish" it only builds.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Also draft a GitHub release (main only). Leave off to only build."
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # First class
          - { name: Windows x64, os: windows-latest, triple: x86_64-pc-windows-msvc, bundles: msi, experimental: false }
          - { name: macOS Apple Silicon, os: macos-latest, triple: aarch64-apple-darwin, bundles: "app,dmg", experimental: false }
          # Secondary
          - { name: macOS Intel, os: macos-15-intel, triple: x86_64-apple-darwin, bundles: "app,dmg", experimental: false }
          # Cannot be hand-tested, so a failure here does not fail the run
          - { name: Linux GNU, os: ubuntu-latest, triple: x86_64-unknown-linux-gnu, bundles: deb, experimental: true }
          - { name: Windows ARM, os: windows-11-arm, triple: aarch64-pc-windows-msvc, bundles: msi, experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install window libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev

      # FFmpeg is built or downloaded once per platform and kept for the next run.
      - name: Remember FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: crates/rangeforge-app/binaries
          key: ffmpeg-${{ matrix.triple }}-${{ hashFiles('scripts/fetch-ffmpeg.sh') }}
      - name: Get FFmpeg
        shell: bash
        run: bash scripts/fetch-ffmpeg.sh "${{ matrix.triple }}" crates/rangeforge-app/binaries

      # The export tests write real files, so run them against the very FFmpeg that goes into
      # the installer. If it cannot do the job, nothing is packaged.
      - name: Test the export with the bundled FFmpeg
        shell: bash
        run: |
          ext=""
          case "${{ matrix.triple }}" in *windows*) ext=".exe" ;; esac
          ffmpeg="$PWD/crates/rangeforge-app/binaries/ffmpeg-${{ matrix.triple }}$ext"
          # On Windows, Git Bash paths must become Windows paths for the Rust tests to use.
          if command -v cygpath > /dev/null; then ffmpeg="$(cygpath -w "$ffmpeg")"; fi
          export RANGEFORGE_FFMPEG="$ffmpeg"
          cargo test -p rangeforge-export -p rangeforge-session

      - name: Remember the Tauri build tool
        id: tauri-cli
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ runner.os }}-${{ runner.arch }}-v2
      - name: Install the Tauri build tool
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the installers
        working-directory: crates/rangeforge-app
        run: cargo tauri build --config tauri.bundle.conf.json --bundles ${{ matrix.bundles }} --ci

      - name: Collect the installers
        shell: bash
        run: |
          mkdir dist
          for pattern in msi/*.msi dmg/*.dmg deb/*.deb; do
            cp target/release/bundle/$pattern dist/ 2> /dev/null || true
          done
          ls -l dist
          test -n "$(ls -A dist)"
      - uses: actions/upload-artifact@v4
        with:
          name: RangeForge-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # The manual, the FAQ and the third-party notices as one PDF. It is quick (no FFmpeg, no
  # compiling), and runs even when an installer build fails, so a problem in one is not hidden by
  # the other. See scripts/build-manual-pdf.sh.
  manual:
    name: Manual PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pandoc comes from the pypandoc_binary package (pinned), which bundles a recent pandoc.
      # Chrome, which prints the page to PDF, is already on the runner.
      - name: Install pandoc
        run: |
          python3 -m venv "$RUNNER_TEMP/pandoc"
          "$RUNNER_TEMP/pandoc/bin/pip" install --quiet pypandoc_binary==1.17
          dir="$("$RUNNER_TEMP/pandoc/bin/python" -c 'import os, pypandoc; print(os.path.dirname(pypandoc.get_pandoc_path()))')"
          echo "$dir" >> "$GITHUB_PATH"
      - name: Build the PDF
        run: |
          pandoc --version | head -n 1
          bash scripts/build-manual-pdf.sh dist-manual/RangeForge-Manual.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: RangeForge-Manual
          path: dist-manual/RangeForge-Manual.pdf
          if-no-files-found: error

  publish:
    name: Draft release
    needs: [package, manual]
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: version
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # Everything before 1.0 is a pre-release.
          case "$version" in 0.*) echo "pre=true" >> "$GITHUB_OUTPUT" ;; *) echo "pre=false" >> "$GITHUB_OUTPUT" ;; esac
      # A published release is never overwritten. Raise the version in Cargo.toml instead.
      - name: Refuse to touch a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> /dev/null)"; then
            if [ "$draft" = "false" ]; then
              echo "::error::$tag is already published. Raise the version in Cargo.toml and try again."
              exit 1
            fi
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ steps.version.outputs.pre }}
          generate_release_notes: true
          files: dist/*
