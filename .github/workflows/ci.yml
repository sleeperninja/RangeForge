name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # First class
          - { name: Windows x64, os: windows-latest, experimental: false }
          - { name: macOS Apple Silicon, os: macos-latest, experimental: false }
          # Secondary: built and tested, not hand-tested
          - { name: macOS Intel, os: macos-15-intel, experimental: false }
          - { name: Linux GNU, os: ubuntu-latest, experimental: false }
          # Needs an ARM runner; may be unavailable on private repositories
          - { name: Windows ARM, os: windows-11-arm, experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The export tests run the real FFmpeg, and fail (instead of skipping) if it is missing.
      - name: Install FFmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) choco install ffmpeg -y --no-progress ;;
            macOS) brew install ffmpeg ;;
            Linux) sudo apt-get update && sudo apt-get install -y ffmpeg ;;
          esac
          ffmpeg -version | head -n 1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
