name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # First class
          - { name: Windows x64, os: windows-latest, experimental: false }
          - { name: macOS Apple Silicon, os: macos-latest, experimental: false }
          # macOS Intel, Linux and Windows ARM cannot be hand-tested, so they are not built on
          # every push (it also spends free minutes). The Release workflow still builds them.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The export tests run the real FFmpeg, and fail (instead of skipping) if it is missing.
      - name: Install FFmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) choco install ffmpeg -y --no-progress ;;
            macOS) brew install ffmpeg ;;
            Linux) sudo apt-get update && sudo apt-get install -y ffmpeg ;;
          esac
          ffmpeg -version | head -n 1
      # The window needs the system web view libraries to build on Linux.
      - name: Install window libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Test the page's display logic
        run: node --test crates/rangeforge-app/frontend/render.test.js
      # Programs you can download and try come from the Release workflow (release.yml), which
      # builds the installers with FFmpeg inside. This workflow only checks the code.
